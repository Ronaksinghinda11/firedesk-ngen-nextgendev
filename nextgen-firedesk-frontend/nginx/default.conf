server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # =========================
    # API → BACKEND
    # =========================
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
    
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    
        client_max_body_size 100M;
        proxy_read_timeout 120s;
    }


    # =========================
    # SPA ROUTES
    # =========================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # =========================
    # STATIC ASSETS CACHE
    # =========================
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|map)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Fix: serve .mjs (ES module workers like pdf.worker) as JavaScript
    # A separate block is required because putting types{} inside a location
    # replaces the *entire* global MIME table, which would break all other assets.
    location ~* \.mjs$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        default_type application/javascript;
    }

    location ~* \.(?:png|jpe?g|gif|svg|ico|webp)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}